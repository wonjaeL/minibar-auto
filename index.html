<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Minibar Auto</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="tabs">
      <button class="tab active" data-tab="excel">Excel → 소비 현황</button>
      <button class="tab" data-tab="xml">XML Viewer</button>
    </header>

    <section id="tab-excel" class="panel active">
      <div class="row">
        <button id="excel-pick">Excel 선택</button>
        <span id="excel-path" class="path muted">Excel 없음</span>
      </div>
      <div class="row">
        <button id="resv-pick">Reservation CSV 선택</button>
        <span id="resv-path" class="path muted">CSV 없음</span>
        <span id="resv-meta" class="muted"></span>
      </div>
      <div class="row">
        <label>날짜 <input type="date" id="excel-date" /></label>
        <button id="excel-run" disabled>추출</button>
        <button id="excel-copy" disabled>Room CSV 복사</button>
        <button id="excel-match" disabled title="XML Viewer 탭에서 XML을 먼저 로드하세요">XML과 매칭 + Report</button>
      </div>
      <div class="row">
        <span id="excel-meta" class="muted"></span>
      </div>

      <details class="csv-box">
        <summary>Room No. CSV</summary>
        <textarea id="excel-out" rows="3" readonly></textarea>
      </details>

      <div id="excel-summary" class="cards"></div>

      <div class="row legend hidden" id="legend">
        <span class="lg-item"><span class="sw cell-match"></span>일치</span>
        <span class="lg-item"><span class="sw cell-qty-mismatch"></span>수량 불일치</span>
        <span class="lg-item"><span class="sw cell-only-excel"></span>Excel만</span>
        <span class="lg-item"><span class="sw cell-only-xml"></span>XML만</span>
        <span class="lg-item"><span class="sw cell-have"></span>수량 있음 (미매칭)</span>
      </div>

      <div class="bars" id="excel-bars"></div>

      <div class="table-wrap">
        <table id="excel-pivot">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="excel-extras"></div>

      <div id="report-section" class="hidden">
        <h3>종합 Report</h3>
        <div class="row">
          <label>상태 필터
            <select id="report-status-filter">
              <option value="">전체</option>
              <option value="match">일치만</option>
              <option value="problems">문제 있음만 (mismatch + only)</option>
              <option value="qty-mismatch">수량 불일치</option>
              <option value="only-excel">Excel만</option>
              <option value="only-xml">XML만</option>
            </select>
          </label>
          <label>Room/Conf/Guest/Item 검색
            <input type="text" id="report-search" placeholder="자유 검색…" />
          </label>
          <button id="report-csv">CSV 내보내기</button>
        </div>
        <div class="table-wrap">
          <table id="report-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="tab-xml" class="panel">
      <div class="row">
        <button id="xml-pick">XML 파일 선택</button>
        <span id="xml-path" class="path muted">파일 없음</span>
        <span id="xml-count" class="muted"></span>
      </div>
      <div class="row">
        <button id="xml-clear-filters">필터 초기화</button>
        <button id="xml-clear-sort">정렬 초기화</button>
      </div>
      <div id="xml-columns"></div>
      <div class="table-wrap">
        <table id="xml-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <script src="renderer.js"></script>
  </body>
</html>
